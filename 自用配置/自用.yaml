ipv6: false
vif_only: true
hide_vpn_icon: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Masaiki/GeoIP2-CN/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.apple.com/library/test/success.html
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
compat_route: false
vif_excluded_routes:
- boc.com
- cmbchina.com
dns:
  bootstrap:
  - 202.12.27.33
  - 119.29.29.29
  - 223.6.6.6
  upstreams:
    Secure DNS:
    - https://8.138.89.130/dns-query
    - https://dns.alidns.com/dns-query
    Open DNS:
    - https://8.138.89.130/dns-query
    - https://208.67.222.222/dns-query
    Google DNS:
    - tls:8.8.8.8
    - https://dns.google/dns-query
    Cloudflare DNS:
    - tls:1.1.1.1
    - tls:1.0.0.1
  forward:
  - wildcard:
      match: '*.cn'
      value: system
  - proxy_rule_set:
      match: https://github.com/ACL4SSR/ACL4SSR/raw/master/Clash/ChinaDomain.list
      value: system
  - wildcard:
      match: youtube
      value: tls:8.8.8.8
  - wildcard:
      match: google
      value: tls:8.8.8.8
  - wildcard:
      match: '*'
      value: Cloudflare DNS
  hosts:
    doh.pub:
    - 1.12.12.12
    dns.alidns.com:
    - 223.5.5.5
    dot.pub:
    - 1.12.12.12
    dns.google.com:
    - 8.8.8.8
  block_ips:
  - 157.148.47.204
  public_ip_lookup_url: ifconfig.me/ip
